{% extends 'admin/master.html' %}

{% block content %}
    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Users List</h3>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-end">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Users</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
        <div class="app-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 col-12">
                        <div class="card">
                            <div class="card-header">
                                <a
                                        href="{{ url_for('admin_bp.user') }}"
                                        class="btn btn-secondary"
                                >
                                    <i class="bi bi-arrow-left"></i>
                                    Back
                                </a>
                            </div>
                            <div class="card-body">
                                <form
                                        action="{{ url_for('admin_bp.edit') }}"
                                        method="POST"
                                >
                                    <input type="hidden" name="user_id" value="{{ user.id }}">
                                    <div class="form-group">
                                        <img
                                                src="{{ url_for('static', filename='admin/image') }}/{{ user.profile }}"
                                                alt="User Image"
                                                id="image_preview"
                                                style="width: 100px; height: 100px; object-fit: contain;"
                                                onerror="this.src='{{ url_for('static', filename='admin/image/no_image.png') }}';"
                                        >
                                        <input
                                                type="file"
                                                class="form-control"
                                                id="image"
                                                name="image"
                                                accept="image/*"
                                                onchange="loadFile(event)"
                                        >
                                    </div>
                                    <hr>
                                    <div class="form-group">
                                        <label for="username">Username</label>
                                        <input
                                                type="text"
                                                class="form-control"
                                                id="username"
                                                name="username"
                                                required
                                                value="{{ user.username }}"
                                        >
                                    </div>
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input
                                                type="email"
                                                class="form-control"
                                                id="email"
                                                name="email"
                                                required
                                                value="{{ user.email }}"
                                        >
                                    </div>
                                    <div class="form-group">
                                        <label for="password">Password</label>
                                        <input
                                                type="password"
                                                class="form-control"
                                                id="password"
                                                name="password"
                                                placeholder="Leave blank to keep the same"
                                        >
                                    </div>
                                    <div class="form-group">
                                        <label for="role">Role</label>
                                        <select class="form-control" id="role" name="role" required>
                                            <option value="user" {{ 'selected' if user.role == 'user' }}>User</option>
                                            <option value="admin" {{ 'selected' if user.role == 'admin' }}>Admin</option>
                                        </select>
                                    </div>
                                    <hr>
                                    <button type="submit" class="btn btn-primary float-end">
                                        <i class="bi bi-floppy"></i>
                                        Edit User
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        </div>
        </div>
    </main>
{% endblock %}
{% block script %}
    <script>
        var loadFile = function (event) {
            var output = document.getElementById('image_preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.onload = function () {
                URL.revokeObjectURL(output.src) // free memory
            }
        };
    </script>
{% endblock %}
