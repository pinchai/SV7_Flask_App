{% extends 'admin/master.html' %}

{% block content %}
    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Users List</h3>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-end">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Users</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
        <div class="app-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 col-12">
                        <div class="card">
                            <div class="card-header">
                                <a
                                        href="{{ url_for('user') }}"
                                        class="btn btn-secondary"
                                >
                                    <i class="bi bi-arrow-left"></i>
                                    Back
                                </a>
                            </div>
                            <div class="card-body">
                                <form
                                        action="{{ url_for('delete_user') }}"
                                        method="POST"
                                >
                                    <input type="hidden" name="user_id" value="{{ user.id }}">
                                    <h3
                                            style="background-color: yellow; padding: 10px; color: firebrick; text-align: center; border-radius: 5px;"
                                    >Do you want to delete this user?</h3>
                                    <center>
                                        <img
                                                src="{{ url_for('static', filename='admin/image/no_image.png') }}"
                                                alt="User Image"
                                                id="image_preview"
                                                style="width: 100px; height: 100px; object-fit: contain;"
                                        >
                                        <ul
                                                style="list-style: none; padding: 0; margin: 0;"
                                        >
                                            <li>Name: {{ user.username }}</li>
                                            <li>Email: {{ user.email }}</li>
                                            <li>Role: {{ user.role }}</li>
                                        </ul>
                                    </center>
                                    <hr>
                                    <button type="submit" class="btn btn-danger float-end">
                                        <i class="bi bi-floppy"></i>
                                        Confirm Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        </div>
        </div>
    </main>
{% endblock %}
{% block script %}
    <script>
        var loadFile = function (event) {
            var output = document.getElementById('image_preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.onload = function () {
                URL.revokeObjectURL(output.src) // free memory
            }
        };
    </script>
{% endblock %}
