<html lang="en">
<!--begin::Head-->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <!--begin::Accessibility Meta Tags-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)"/>
    <!--end::Accessibility Meta Tags-->

    <!--begin::Primary Meta Tags-->
    <meta name="title" content="AdminLTE 4 | Login Page"/>
    <meta name="author" content="ColorlibHQ"/>
    <meta
            name="description"
            content="AdminLTE is a free Bootstrap 5 admin dashboard template with almost 50 example pages, built with vanilla JS and designed with accessibility in mind."
    />
    <meta
            name="keywords"
            content="bootstrap 5, bootstrap, bootstrap 5 admin dashboard, bootstrap 5 dashboard, bootstrap 5 charts, bootstrap 5 calendar, bootstrap 5 datepicker, bootstrap 5 tables, bootstrap 5 datatable, vanilla js datatable, colorlibhq, colorlibhq dashboard, colorlibhq admin dashboard, accessible admin panel"

<body class="login-page bg-body-secondary">
<main class="login-box">
    <h1 class="login-logo">
        <a href="#l"><b>Admin</b>LTE</a>
    </h1>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Sign in to start your session</p>

            <form
                    action="{{ url_for('admin_bp.admin_do_login') }}"
                    method="post"
            >
                <label class="visually-hidden" for="loginEmail">Username</label>
                <div class="input-group mb-3">
                    <input
                            id="username"
                            name="username"
                            type="text"
                            class="form-control"
                            placeholder="Username"
                    />
                    <div class="input-group-text">
                        <span class="bi bi-envelope"></span>
                    </div>
                </div>
                <label class="visually-hidden" for="password">Password</label>
                <div class="input-group mb-3">
                    <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            placeholder="password"
                    />
                    <div class="input-group-text">
                        <span class="bi bi-lock-fill"></span>
                    </div>
                </div>
                <hr>
                <input type="submit" class="w-100 btn btn-primary" value="Login">
            </form>

            <div class="social-auth-links text-center mb-3 d-grid gap-2">
                <p>- OR -</p>
                <a href="#" class="btn btn-primary">
                    <i class="bi bi-facebook me-2"></i> Sign in using Facebook
                </a>
                <a href="#" class="btn btn-danger">
                    <i class="bi bi-google me-2"></i> Sign in using Google
                </a>
            </div>
        </div>
    </div>
</main>
{% include 'admin/share/footer_script.html' %}
</body>

</html>
